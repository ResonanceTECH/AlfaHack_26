# Дополнение к docker-compose.yml для локального запуска LLM на Linux.
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - "${HOME}/llm-models:/models:ro,Z"
    ports:
      - "127.0.0.1:8081:8080"
    command:
      - "-m"
      - "/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
      - "--alias"
      - "Qwen3-4B-Instruct-2507"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--threads"
      - "4"
      - "--ctx-size"
      - "8192"
      - "--parallel"
      - "1"

  api:
    environment:
      LLM_ENABLED: "true"
      LLM_BASE_URL: "http://llm:8080/v1"
      LLM_MAIN: "Qwen3-4B-Instruct-2507"
      LLM_LIGHT: "Qwen3-4B-Instruct-2507"
      LLM_TIMEOUT_SECONDS: "120"
      LLM_MAX_TOKENS: "900"
      LLM_API_KEY: ""
